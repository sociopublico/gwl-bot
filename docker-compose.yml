services:
  monitor:
    build: .
    env_file:
      - .env
    environment:
      OMP_NUM_THREADS: ${CPU_THREADS:-4}
    restart: unless-stopped
    # HEALTHCHECK lo define el Dockerfile (logs/.heartbeat).
    # unhealthy no reinicia el contenedor: mirá `docker compose ps` y el mail MONITOR_STALE.
    init: true
    stop_grace_period: 20s
    volumes:
      - whisper-models:/root/.cache/huggingface
      # Lista de oradores (nombre | país | cargo):
      - ./speakers.txt:/speakers.txt:ro
      # Logs duales (full + highlights), flush inmediato:
      - ./logs:/app/logs
      # Cookies Netscape de YouTube (yt-dlp puede reescribirlas; no montar :ro):
      - ./youtube.cookies.txt:/cookies/youtube.txt

volumes:
  whisper-models:
