name: progress-site

on:
  push:
    branches: [main]
    paths:
      - "pipeline/data/roster/**"
      - "pipeline/data/analysis/**"
      - "pipeline/data/alerts/**"
      - "pipeline/data/coding/**"
      - "pipeline/out/**"
      - "pipeline/progress.py"
      - "pipeline/alerts_site.py"
      - "pipeline/coding.py"
      - "pipeline/cli.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar sitio de avance
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: |
          python -m pipeline progress-site --session 81
          python -m pipeline progress-site --session 80
          python -m pipeline alerts-site --session 81
          python -m pipeline alerts-site --session 80

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
