# Pipeline UNGA (extract / publish). No levanta el monitor de YouTube.
# Roster (scrape) en la laptop; acá: extract --session 80 --day 2025-09-23
# Uso: docker compose -f docker-compose.pipeline.yml run --rm pipeline extract --session 81 --day 2026-09-22

name: gwl-pipeline

services:
  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      OMP_NUM_THREADS: ${PIPELINE_CPU_THREADS:-1}
      CPU_THREADS: ${PIPELINE_CPU_THREADS:-1}
      # El .env compartido del bot YouTube suele tener WHISPER_MODEL=base (más RAM).
      WHISPER_MODEL: ${PIPELINE_WHISPER_MODEL:-tiny}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/google-sa.json
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-gwl-pipeline}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-gwl-bot@users.noreply.github.com}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-gwl-pipeline}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-gwl-bot@users.noreply.github.com}
      # El .env de Traefik a veces trae HTTP_PROXY; urllib lo usaría y gadebate da 202 vacío.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    init: true
    tty: false
    stdin_open: false
    shm_size: "1gb"
    working_dir: /app
    volumes:
      # Repo completo: journals, txt, y git para publish --github
      - .:/app
      - whisper-models:/root/.cache/huggingface
      - ${PIPELINE_SA_FILE:-./secrets/google-sa.json}:/secrets/google-sa.json:ro

volumes:
  whisper-models:
