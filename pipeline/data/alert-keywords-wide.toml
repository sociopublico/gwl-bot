# Lista ancha (primera simulación): muchas palabras sueltas.
# Matching: case-insensitive, word boundaries (app/detector.py).

cooldown_seconds = 120
chunk_seconds = 20
chunk_overlap_seconds = 4
words_per_minute = 140
speech_gap_seconds = 90

