# Punto medio: 8 keywords (más alias de matching).
# Objetivo: ~60 mails/día, menos de 100.

cooldown_seconds = 120
chunk_seconds = 20
chunk_overlap_seconds = 4
words_per_minute = 140
speech_gap_seconds = 90

[[group]]
name = "gender"
keywords = [
  "gender equality",
  "women and girls",
  "women's leadership",
  "women’s leadership",
]

[[group]]
name = "secretary_general"
keywords = [
  "new secretary general",
  "female candidates",
]

[[group]]
name = "multilateral_order"
keywords = [
  "multilateralism",
  "un80",
  "un 80",
  "un-80",
  "geopolitical",
]
